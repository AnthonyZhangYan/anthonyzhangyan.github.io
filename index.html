<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yan Zhang — Personal Homepage</title>
  <meta name="description" content="Academic personal homepage" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Basic SEO -->
  <meta name="author" content="Yan Zhang" />
  <meta name="keywords" content="Yan Zhang, Florida State University, Machine Learning, AI for Science, Bayesian Optimization, Large Language Models" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <!-- Open Graph / Twitter Card -->
  <meta property="og:title" content="Yan Zhang — Personal Homepage" />
  <meta property="og:description" content="Graduate student at Florida State University. Machine Learning, AI for Science, Bayesian Optimization, LLMs." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://anthonyzhang.me/" />
  <meta property="og:image" content="https://anthonyzhang.me/assets/og-cover.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Yan Zhang — Personal Homepage" />
  <meta name="twitter:description" content="Graduate student at Florida State University. Machine Learning, AI for Science, Bayesian Optimization, LLMs." />
  <meta name="twitter:image" content="https://anthonyzhang.me/assets/og-cover.png" />

  <!-- Favicon / Icons -->
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/favicon.svg">
  <link rel="mask-icon" href="assets/favicon.svg" color="#2563eb">
</head>
<body>
  <div class="container">

    <nav class="menu" aria-label="Primary">
      <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="menu-list">
        ☰ Menu
      </button>
      <ul id="menu-list" class="menu-list" role="menu">
        <li role="none"><a role="menuitem" href="#about">Homepage</a></li>
        <li role="none"><a role="menuitem" href="#news">News</a></li>
        <li role="none"><a role="menuitem" href="#publications">Publications</a></li>
        <li role="none"><a role="menuitem" href="#misc">Misc</a></li>
      </ul>
    </nav>

    <header id="about">
      <img src="assets/avatar.jpg" alt="Avatar" onerror="this.style.display='none'"/>
      <div id="profile-info"></div>
    </header>

    <section class="bio"><h2>Bio</h2><p id="bio"></p></section>

    <section id="education">
      <h2>Education</h2>
      <ul class="ed-grid edu-grid" id="edu-list"></ul>
    </section>

    <section id="news">
      <h2>News</h2>
      <ul class="scrollbox" id="news-list"></ul>
    </section>

    <section id="publications">
      <h2>Publications</h2>
      <div class="controls">
        <label for="sort-by">Preference</label>
        <select id="sort-by">
          <option value="year_desc">Newest first (Year ↓)</option>
          <option value="year_asc">Oldest first (Year ↑)</option>
          <option value="venue_az">Venue A → Z</option>
          <option value="venue_za">Venue Z → A</option>
        </select>
      </div>
      <div class="scrollbox" id="pubs"></div>
    </section>

    <section id="misc" class="misc">
      <h2>Misc</h2>
      <ul id="misc-list"></ul>
    </section>

    <footer>
      <div class="hr"></div>
      <div>© <span id="year"></span> Yan Zhang. Built with ❤️ and a dash of AI.</div>
    </footer>

  </div>
  <script src="main.js"></script>
</body>
</html>
